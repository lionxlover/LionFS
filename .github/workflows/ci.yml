name: LionFS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------
  # The 3-OS matrix: the same suite on every platform (RFC-003's rule:
  # one semantics, many substrates -- the suite proves it).
  # ---------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build (portable)
        run: cargo build --verbose

      - name: Test (portable)
        run: cargo test --verbose

      - name: PAL capability report
        run: cargo run --bin lfs_palinfo

  # ---------------------------------------------------------------------
  # Linux fast path: the io_uring feature (probed; falls back gracefully
  # on runners that refuse the ring).
  # ---------------------------------------------------------------------
  test-io-uring:
    name: Test (linux, io_uring)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --verbose --features io_uring
      - run: cargo test --verbose --features io_uring
      - name: Engine benchmark smoke (1 round)
        run: cargo run --features io_uring --bin lfs_engine -- 4096 8 1

  # ---------------------------------------------------------------------
  # Lint gate: clippy must be error-clean; format must be rustfmt-clean.
  # ---------------------------------------------------------------------
  lint:
    name: Clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt -- --check
      - run: cargo clippy --lib --bins -- -D warnings
      - name: Clippy (io_uring feature)
        run: cargo clippy --lib --features io_uring -- -D warnings

  # ---------------------------------------------------------------------
  # No-deps cross-check: prove the core has no unix-only imports outside
  # the PAL and the vfs bridge (RFC-003 rule 1/2/3).
  # ---------------------------------------------------------------------
  portability-gate:
    name: Portability gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No libc/fuser/unix imports outside pal and bridges
        run: |
          violations=$(grep -rn "libc::" src/ \
            | grep -v "^src/pal/" \
            | grep -v "^src/io_engine/uring.rs" \
            | grep -v "^src/vfs/fuse_bridge.rs" \
            | grep -v "^src/fuse/" || true)
          if [ -n "$violations" ]; then
            echo "::error::libc:: found outside the PAL/bridges:"
            echo "$violations"
            exit 1
          fi
          unix_imports=$(grep -rn "os::unix\|os::windows" src/ \
            | grep -v "^src/pal/" \
            | grep -v "^src/vfs/fuse_bridge.rs" || true)
          if [ -n "$unix_imports" ]; then
            echo "::error::std::os::unix/windows imports outside the PAL/bridges:"
            echo "$unix_imports"
            exit 1
          fi
          echo "portability gate: clean"

  # ---------------------------------------------------------------------
  # Benchmarks compile (not run in CI; --no-run keeps the harness honest).
  # ---------------------------------------------------------------------
  benches:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo bench --no-run

  # ---------------------------------------------------------------------
  # Release build + artifact (Linux, io_uring on).
  # ---------------------------------------------------------------------
  release-build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --features io_uring
      - uses: actions/upload-artifact@v4
        with:
          name: lionfs-linux-release
          path: target/release/
          retention-days: 7
