# cargo-deny configuration. Run: cargo deny check
# (advisories need `cargo deny fetch`)

[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
ignore = []

[licenses]
# The dependency tree is permissive-only by policy:
# MIT OR Apache-2.0 (Rust ecosystem), BSD, ISC, Zlib, Unicode-3.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
