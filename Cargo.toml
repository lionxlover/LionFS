# LionFS 8.0 — The Unified Release (LFS × HFS merge)
#
# Workspace layout:
#   crates/lionfs         — the local engine (FUSE/PAL/io_uring/RAID/B-epsilon),
#                           lib name `lionfs_core`, 58 tools. Formerly "LionFS 7.1".
#   crates/lionfs-cluster — the distributed data plane (Raft, CRDT, CDC dedup,
#                           Reed-Solomon EC, WAL, convergent crypto, time-travel
#                           DAG). Formerly "HelixFS (HFS)".
#   crates/lionfs-cli     — the unified `lion` front-end.

[workspace]
resolver = "2"
members = [
    "crates/lionfs",
    "crates/lionfs-cluster",
    "crates/lionfs-cli",
]

[workspace.package]
version = "8.0.0"
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
authors = ["Lion", "LionFS Project"]

[workspace.dependencies]
# Shared between the engine and the cluster plane.
blake3 = "1.5"
crc32fast = "1.3"
sha2 = "0.10"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
thiserror = "1.0"
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.bench]
opt-level = 3
lto = "thin"
