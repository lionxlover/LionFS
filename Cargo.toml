[package]
name = "lionfs"
version = "2.0.0"
edition = "2021"
rust-version = "1.75"
authors = ["Lion"]
description = "LionFS 2.0: line-rate, media-aware, self-healing universal file system (cross-platform: Linux, macOS, Windows)"
repository = "https://example.invalid/lionfs"
license = "MIT OR Apache-2.0"
keywords = ["filesystem", "storage", "io-uring", "fuse", "zns"]
categories = ["filesystem", "os"]

[lib]
name = "lionfs_core"
path = "src/lib.rs"

# ---------------------------------------------------------------------------
# Platform-scoped dependencies.
#
# LionFS 2.0 targets Linux, macOS and Windows from one code base. The core
# engine is pure Rust; everything platform-specific is either a std API
# behind the `pal` module or one of the small target-scoped dependency sets
# below. Notably the Windows build needs NO external crates: the pal layer
# reaches DeviceIoControl / FlushFileBuffers / ProcessPrng through raw
# `extern "system"` FFI, so the dependency graph on Windows is std-only.
# ---------------------------------------------------------------------------
# POSIX platforms (Linux, macOS, BSDs): FUSE mounting (Linux fuse / macOS
# macFUSE via fuser 0.12) and the libc errno/ioctl/fcntl surface.
[target.'cfg(unix)'.dependencies]
fuser = { version = "0.12", default-features = false, features = ["abi-7-10"] }
libc = "0.2"

# Linux-only: the io_uring submission plane (Pillar I, RFC-002 §3.1).
# Optional -- the engine degrades to the portable threaded backend when the
# feature is off, when the kernel refuses io_uring_setup, or when the ring
# is otherwise unavailable at runtime.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7", optional = true }

[features]
default = []
# Linux io_uring I/O engine backend (LFS-RFC-002 Pillar I).
io_uring = ["dep:io-uring"]

[dependencies]
bytemuck = { version = "1.14", features = ["derive", "min_const_generics"] }
crc32fast = "1.3"
blake3 = "1.5"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
lz4_flex = "0.11"
zstd = "0.13"
flate2 = "1.0"
log = "0.4"
env_logger = "0.10"
moka = { version = "0.12", features = ["sync"] }
crossbeam = "0.8"
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh3"] }
sha2 = "0.10"
rayon = "1.8"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
tempfile = "3.10"

